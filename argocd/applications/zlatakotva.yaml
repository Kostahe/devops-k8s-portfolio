apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zlatakotva
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://gitlab.example.local/example/devops-k8s.git'
    targetRevision: master
    path: k8s/apps/zlatakotva
    directory:
      recurse: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: zlatakotva
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
