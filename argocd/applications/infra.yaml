apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.example.local/example/devops-k8s.git
    targetRevision: master
    path: k8s/infra
    # Include all manifests under nested infra folders (e.g. bootstrap/)
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
