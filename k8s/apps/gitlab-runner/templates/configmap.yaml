apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gitlab-runner.name" . }}-config
data:
  config.toml.tpl: |
    concurrent = 2
    check_interval = 5
    listen_address = ":9252"

    [[runners]]
      name = "{{ .Values.runnerName }}"
      url = "{{ .Values.gitlabUrl }}"
      token = "__RUNNER_TOKEN__"
      executor = "kubernetes"

      [runners.kubernetes]
        namespace = "{{ .Values.job.namespace }}"
        image = "{{ .Values.job.image }}"
        privileged = {{ .Values.job.privileged }}
        poll_timeout = {{ .Values.job.pollTimeout }}

      [[runners.kubernetes.services]]
        name = "{{ .Values.job.serviceImage }}"
        alias = "docker"