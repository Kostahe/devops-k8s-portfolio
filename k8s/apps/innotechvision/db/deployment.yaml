apiVersion: apps/v1
kind: Deployment
metadata:
  name: innotechvision-mariadb
  namespace: innotechvision
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: innotechvision-mariadb
  template:
    metadata:
      labels:
        app: innotechvision-mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:10.11
          ports:
            - containerPort: 3306
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: innotechvision-secret
                  key: MARIADB_ROOT_PASSWORD
            - name: MARIADB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: innotechvision-secret
                  key: MARIADB_DATABASE
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: innotechvision-secret
                  key: MARIADB_USER
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: innotechvision-secret
                  key: MARIADB_PASSWORD
          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mariadb-data
          persistentVolumeClaim:
            claimName: innotechvision-mariadb-pvc