apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: parkovani-ingress
  namespace: parkovani
spec:
  ingressClassName: public
  rules:
    - host: parkovani.example.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: parkovani-app
                port:
                  number: 80
