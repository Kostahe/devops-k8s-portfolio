apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zlatakotva-ingress
  namespace: zlatakotva
spec:
  ingressClassName: public
  rules:
    - host: zlatakotva.example.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zlatakotva-app
                port:
                  number: 80
