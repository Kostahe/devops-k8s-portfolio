apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dexd-bazar-ingress
  namespace: dexd-bazar
spec:
  ingressClassName: public
  rules:
    - host: dexd-bazar.example.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dexd-bazar-app
                port:
                  number: 80
