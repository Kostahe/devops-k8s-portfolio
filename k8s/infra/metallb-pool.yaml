apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: example-lan-pool
  namespace: metallb-system
spec:
  addresses:
    - "<METALLB_IP_RANGE>"

---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: example-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - example-lan-pool
